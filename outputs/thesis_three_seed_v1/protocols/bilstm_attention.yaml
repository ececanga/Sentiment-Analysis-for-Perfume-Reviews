experiment:
  id: source_grouped_weighted_synthetic_bilstm_attention_v1
  phase: 6
  status: frozen_before_first_formal_run
  role: full_five_model_synthetic_variation_bilstm_attention
  created_date: '2026-08-10'
  interpretation_boundary: This is a weighted text-augmentation sensitivity analysis.
    It tests whether the fixed 784x3 synthetic-review corpus changes held-out YouTube
    performance for the accepted BiLSTM + Attention specification. Synthetic reviews
    are generated observations and are not treated as independent natural reviews.
inputs:
  accepted_benchmark_config:
    path: config/evaluation_config_gemini_browser_og784_source_grouped_v1.yaml
    sha256: 44852e49d8ab2654ed233fd48d0a237c3e6abb924331d38d259f5ba03792bff2
  accepted_bilstm_runner:
    path: src/training/run_bilstm_attention_benchmark.py
    sha256: cd66363ca8495e5e82e149887b514e1dbd93f8b7cf1b88020b9eaa8aede7e629
  youtube_deep_text_jsonl:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/datasets/perfume_text_dataset_v1.jsonl
    sha256: 48f30d49041f80dc4bd8cfb755177b6b520c3b7fdb47dbf6cc66b243d97c129f
    expected_perfumes: 784
    expected_chunks: 4879
  canonical_youtube_labels:
    path: labels/gemini_browser_og784/gemini_browser_labels_og784_v1.csv
    sha256: d69318ea2ad04f574ccbe8d6b348041551a4762379673ec2e8cba0d2b0ad461e
  synthetic_text_labels:
    path: outputs/synthetic_review_level_tests/emotion_rich_v2_3reviews/supervised_eval_gemini_browser/review_level_features_labeled_g25pro.csv
    sha256: c96f08081da4ba9a58a0a9ded856c68d61110cf2add218906a126198d1400715
    expected_rows: 2352
    expected_reviews_per_perfume: 3
    text_column: Final Transcript
  outer_fold_manifest:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/tables/fold_assignments.csv
    sha256: 5338fbb3f05a51d2dc7ec42564f5cf9d31f3c742dc278e31fb1f4dbf5f47e579
    expected_rows: 784
    expected_source_components: 359
  inner_validation_manifest:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/tables/inner_validation_folds.csv
    sha256: 56172122cf0bc2d36e4ad5240feb3677eee27ab82387fc8fd0182f162bb24e0d
  accepted_youtube_control_oof:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/predictions/bilstm_attention_oof.csv
    sha256: 6bb2309a4080eaa602efd95293261d5c8c117a6393ea572856b95ad1bd72f624
  accepted_youtube_control_metrics:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/metrics/bilstm_attention.json
    sha256: b3ffb60fcb58a07c06f2138958240d89fce2350c5a82f54bae206185e83a4248
task:
  evaluation_rows: held_out_youtube_perfumes_only
  official_labels:
  - joy
  - sadness
  - fear
  - trust
  - surprise
  - anticipation
  - disgust
  excluded_label: anger
  sensitivity_labels:
  - joy
  - sadness
  - trust
  - surprise
  - anticipation
  - disgust
model:
  family: BiLSTM + Attention
  device: cpu
  random_seed: 42
  training_mode: from_scratch_sequence_encoder
  tokenizer: regex_word_tokenizer
  lowercase_tokens: true
  min_token_freq: 2
  max_vocab_size: 20000
  max_tokens: 208
  embedding_dim: 96
  hidden_size: 64
  attention_dim: 64
  lstm_layers: 1
  dropout: 0.3
  train_batch_size: 64
  eval_batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 12
  patience: 2
  min_delta: 0.0001
  max_grad_norm: 1.0
  selection_metric: macro_f1
  attention_pooling: learned_additive_attention
  loss: weighted_binary_cross_entropy_with_logits
  class_balance: weighted_labelwise_negative_to_positive_ratio
conditions:
  youtube_only:
    youtube_chunk_base_weight: inverse_native_chunk_count
    synthetic_rows: 0
    validation: replay_must_match_accepted_control_oof
  youtube_plus_weighted_synthetic_784x3:
    youtube_chunk_base_weight: inverse_native_chunk_count
    synthetic_review_base_weight: 0.3333333333333333
    synthetic_total_base_weight_per_perfume: 1.0
    synthetic_inner_train_only: true
    validation_and_test_youtube_only: true
    recompute_weighted_pos_weight: true
evaluation:
  threshold: 0.3
  reported_metrics:
  - macro_average_precision
  - macro_f1
  - macro_roc_auc
  per_label_diagnostics: true
  component_equal_point_estimates: true
  paired_source_component_bootstrap:
    repetitions: 2000
    seed: 42
    confidence_level: 0.95
    interval: percentile
    resampling_unit: source_group_id
    identical_draws_for_both_conditions: true
  interpretation_rule: Treat augmentation as an established improvement for a metric
    only when its paired interval excludes zero in the positive direction. Report
    all three metrics and the six-label fear-excluded sensitivity.
execution:
  task_order: control_then_augmented
  fold_task_count: 10
  checkpoint_granularity:
  - epoch
  - fold
  resume_by_default: true
  pause_after_current_epoch_on_signal: true
  control_probability_tolerance: 1.0e-06
scope_exclusions:
- no_threshold_tuning
- no_784x6_model_selection
- no_balancing_grid_selection
- no_synthetic_only_rerun
- no_thesis_edit_during_experiment_execution
outputs:
  root: outputs/source_grouped_weighted_synthetic_bilstm_attention_v1
