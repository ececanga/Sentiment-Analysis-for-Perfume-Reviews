task:
  evaluation_rows: held_out_youtube_perfumes_only
  official_labels:
  - joy
  - sadness
  - fear
  - trust
  - surprise
  - anticipation
  - disgust
  excluded_label: anger
  sensitivity_labels:
  - joy
  - sadness
  - trust
  - surprise
  - anticipation
  - disgust
model:
  family: BERT
  device: cpu
  random_seed: 42
  training_mode: end_to_end_finetune
  checkpoint: monologg/bert-base-cased-goemotions-original
  checkpoint_revision: 13c44c849132f82bb61188d909a574badffb27a3
  checkpoint_files:
    config.json: bb78405aa8c536f30b0f517f715a3474aa420a91118bbf8bf79c4b704dcd122b
    tokenizer_config.json: 8327d5ec8fdafca3621ef26bf124a91bf1f9a0600e58263f16f9ee259c8fd0d9
    special_tokens_map.json: b8a8c41fe8751a59725136c615752d3c109ea69d32b2dc355be42b1b459ec410
    vocab.txt: 061925b27f9870e8ad6f6c02405508d5380fbb8279f7a418a61a2ddd7fa55a11
    pytorch_model.bin: ab2b94588c862d96c040024c8a92e248b37445a2ac62f5b010a65e36806c3024
  local_files_only: true
  max_length: 96
  aggregation_strategy: mean_probability
  train_batch_size: 8
  eval_batch_size: 16
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_epochs: 3
  patience: 1
  min_delta: 0.0001
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  selection_metric: macro_f1
  loss: weighted_binary_cross_entropy_with_logits
  class_balance: weighted_labelwise_negative_to_positive_ratio
conditions:
  youtube_only:
    execution: reuse_accepted_control_without_retraining
    replay_validation: compare_archived_exact_replay_to_accepted_oof
  youtube_plus_weighted_synthetic_784x3:
    youtube_chunk_base_weight: inverse_native_chunk_count
    synthetic_review_base_weight: 0.3333333333333333
    synthetic_total_base_weight_per_perfume: 1.0
    synthetic_inner_train_only: true
    validation_and_test_youtube_only: true
    recompute_weighted_pos_weight: true
evaluation:
  threshold: 0.3
  reported_metrics:
  - macro_average_precision
  - macro_f1
  - macro_roc_auc
  per_label_diagnostics: true
  component_equal_point_estimates: true
  paired_source_component_bootstrap:
    repetitions: 2000
    seed: 42
    confidence_level: 0.95
    interval: percentile
    resampling_unit: source_group_id
    identical_draws_for_both_conditions: true
  interpretation_rule: Treat augmentation as an established improvement for a metric
    only when its paired interval excludes zero in the positive direction. Report
    all three metrics and the six-label fear-excluded sensitivity.
execution:
  task_order: augmented_folds_1_to_5
  fold_task_count: 5
  checkpoint_granularity:
  - epoch
  - fold
  resume_by_default: true
  pause_after_current_epoch_on_signal: true
  control_probability_tolerance: 1.0e-06
scope_exclusions:
- no_control_retraining
- no_threshold_tuning
- no_784x6_model_selection
- no_balancing_grid_selection
- no_synthetic_only_rerun
- no_thesis_edit_during_experiment_execution
