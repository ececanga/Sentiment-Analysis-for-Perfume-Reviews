experiment:
  id: source_grouped_weighted_synthetic_xgboost_v1
  phase: 6
  status: frozen_before_first_formal_run
  role: full_five_model_synthetic_variation_xgboost
  created_date: '2026-08-10'
  interpretation_boundary: >-
    This is a weighted mixed-granularity sensitivity analysis. It tests whether
    the fixed 784x3 synthetic review corpus changes held-out YouTube performance
    for the accepted XGBoost specification; it does not treat synthetic reviews
    as independent natural observations.

inputs:
  youtube_feature_labels:
    path: outputs/gemini_browser_og784/analysis_out/gemini_browser_og784_feature_labels.csv
    sha256: 518048e34d1b9145cd98d70cf63dbda730b55e80eb7c66db42f3d73103c52976
    expected_rows: 784
  synthetic_feature_labels:
    path: outputs/synthetic_review_level_tests/emotion_rich_v2_3reviews/supervised_eval_gemini_browser/review_level_features_labeled_g25pro.csv
    sha256: c96f08081da4ba9a58a0a9ded856c68d61110cf2add218906a126198d1400715
    expected_rows: 2352
    expected_reviews_per_perfume: 3
  outer_fold_manifest:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/tables/fold_assignments.csv
    sha256: 5338fbb3f05a51d2dc7ec42564f5cf9d31f3c742dc278e31fb1f4dbf5f47e579
    expected_rows: 784
    expected_source_components: 359
  accepted_youtube_control_oof:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/predictions/xgboost_oof.csv
    sha256: 310055d3283c7c6ccf5b26b17516587e74b31d3dfc49b9d00cea911f3918b949
  accepted_youtube_control_metrics:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/metrics/xgboost.json
    sha256: e389b6ae719486667e2726c8ff357b5d744b3ae015b8a19602341330179dfa0c

task:
  evaluation_rows: held_out_youtube_perfumes_only
  official_labels:
    - joy
    - sadness
    - fear
    - trust
    - surprise
    - anticipation
    - disgust
  excluded_label: anger
  sensitivity_labels:
    - joy
    - sadness
    - trust
    - surprise
    - anticipation
    - disgust
  feature_families:
    - NRC
    - VAD
    - Hartmann
    - Savani
    - GoEmotions
    - Cardiff
  expected_feature_count: 58

model:
  family: XGBClassifier
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.8
  reg_lambda: 1.0
  min_child_weight: 1.0
  objective: binary:logistic
  eval_metric: logloss
  random_seed: 42
  n_jobs: 1
  tree_method: hist
  preprocessing:
    imputer: median
  class_balance: weighted_labelwise_negative_to_positive_ratio

conditions:
  youtube_only:
    youtube_row_weight: 1.0
    synthetic_rows: 0
    validation: replay_must_match_accepted_control_oof
  youtube_plus_weighted_synthetic_784x3:
    youtube_row_weight: 1.0
    synthetic_row_weight: 0.3333333333333333
    synthetic_total_weight_per_perfume: 1.0
    exclude_synthetic_for_outer_test_perfumes: true
    apply_weight_to:
      - XGBClassifier
    weighted_class_balance: true

evaluation:
  threshold: 0.3
  reported_metrics:
    - macro_average_precision
    - macro_f1
    - macro_roc_auc
  per_label_diagnostics: true
  component_equal_point_estimates: true
  paired_source_component_bootstrap:
    repetitions: 2000
    seed: 42
    confidence_level: 0.95
    interval: percentile
    resampling_unit: source_group_id
    identical_draws_for_both_conditions: true
  interpretation_rule: >-
    Treat augmentation as an established improvement for a metric only when
    its paired interval excludes zero in the positive direction. Report all
    three metrics without designating a single main metric. Also report the
    six-label fear-excluded sensitivity because fear has only three YouTube
    positives.

execution:
  task_order: control_then_augmented
  task_count: 70
  checkpoint_granularity: fold_by_label
  resume_by_default: true
  pause_after_current_fit_on_signal: true

scope_exclusions:
  - no_threshold_tuning
  - no_784x6_model_selection
  - no_balancing_grid_selection
  - no_synthetic_only_rerun
  - no_thesis_edit_during_experiment_execution

outputs:
  root: outputs/source_grouped_weighted_synthetic_xgboost_v1
