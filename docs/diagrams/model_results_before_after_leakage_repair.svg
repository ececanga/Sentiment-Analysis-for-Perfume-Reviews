<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Model results before and after leakage repair</title>
  <desc id="desc">A comparison table showing macro F1 and macro ROC-AUC before and after source-grouped leakage repair for five models.</desc>

  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #5b6577; }
      .group { font: 700 21px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .header { font: 700 18px Arial, Helvetica, sans-serif; fill: #25314a; }
      .model { font: 600 19px Arial, Helvetica, sans-serif; fill: #172033; }
      .value { font: 400 19px Arial, Helvetica, sans-serif; fill: #25314a; font-variant-numeric: tabular-nums; }
      .best { font: 700 19px Arial, Helvetica, sans-serif; fill: #172033; font-variant-numeric: tabular-nums; }
      .note { font: 400 16px Arial, Helvetica, sans-serif; fill: #5b6577; }
      .grid { stroke: #cdd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="600" fill="#ffffff"/>
  <text class="title" x="60" y="58">Model Results Before and After Leakage Repair</text>
  <text class="subtitle" x="60" y="90">Pooled out-of-fold macro metrics at the fixed 0.30 threshold</text>

  <!-- Group headers -->
  <rect x="60" y="122" width="430" height="96" rx="8" fill="#263b64"/>
  <rect x="490" y="122" width="425" height="48" fill="#263b64"/>
  <rect x="915" y="122" width="425" height="48" rx="8" fill="#263b64"/>
  <text class="group" x="275" y="181" text-anchor="middle">Model</text>
  <text class="group" x="702.5" y="153" text-anchor="middle">Before Repair</text>
  <text class="group" x="1127.5" y="153" text-anchor="middle">After Repair</text>

  <!-- Column headers -->
  <rect x="490" y="170" width="212.5" height="48" fill="#eef1f5"/>
  <rect x="702.5" y="170" width="212.5" height="48" fill="#eef1f5"/>
  <rect x="915" y="170" width="212.5" height="48" fill="#eef1f5"/>
  <rect x="1127.5" y="170" width="212.5" height="48" fill="#eef1f5"/>
  <text class="header" x="596.25" y="201" text-anchor="middle">Macro-F1</text>
  <text class="header" x="808.75" y="201" text-anchor="middle">Macro ROC-AUC</text>
  <text class="header" x="1021.25" y="201" text-anchor="middle">Macro-F1</text>
  <text class="header" x="1233.75" y="201" text-anchor="middle">Macro ROC-AUC</text>

  <!-- Alternating row backgrounds -->
  <rect x="60" y="218" width="1280" height="58" fill="#ffffff"/>
  <rect x="60" y="276" width="1280" height="58" fill="#f7f9fc"/>
  <rect x="60" y="334" width="1280" height="58" fill="#ffffff"/>
  <rect x="60" y="392" width="1280" height="58" fill="#f7f9fc"/>
  <rect x="60" y="450" width="1280" height="58" fill="#ffffff"/>

  <!-- Grid -->
  <line class="grid" x1="60" y1="218" x2="1340" y2="218"/>
  <line class="grid" x1="60" y1="276" x2="1340" y2="276"/>
  <line class="grid" x1="60" y1="334" x2="1340" y2="334"/>
  <line class="grid" x1="60" y1="392" x2="1340" y2="392"/>
  <line class="grid" x1="60" y1="450" x2="1340" y2="450"/>
  <line class="grid" x1="60" y1="508" x2="1340" y2="508"/>
  <line class="grid" x1="60" y1="218" x2="60" y2="508"/>
  <line class="grid" x1="490" y1="122" x2="490" y2="508"/>
  <line class="grid" x1="702.5" y1="170" x2="702.5" y2="508"/>
  <line class="grid" x1="915" y1="122" x2="915" y2="508"/>
  <line class="grid" x1="1127.5" y1="170" x2="1127.5" y2="508"/>
  <line class="grid" x1="1340" y1="122" x2="1340" y2="508"/>

  <!-- Row labels -->
  <text class="model" x="82" y="254">Logistic Regression</text>
  <text class="model" x="82" y="312">Random Forest</text>
  <text class="model" x="82" y="370">XGBoost</text>
  <text class="model" x="82" y="428">BERT</text>
  <text class="model" x="82" y="486">BiLSTM + Attention</text>

  <!-- Logistic Regression -->
  <text class="value" x="596.25" y="254" text-anchor="middle">0.3602</text>
  <text class="value" x="808.75" y="254" text-anchor="middle">0.5630</text>
  <text class="value" x="1021.25" y="254" text-anchor="middle">0.3592</text>
  <text class="value" x="1233.75" y="254" text-anchor="middle">0.5473</text>

  <!-- Random Forest -->
  <text class="value" x="596.25" y="312" text-anchor="middle">0.3368</text>
  <text class="best" x="808.75" y="312" text-anchor="middle">0.6231</text>
  <text class="value" x="1021.25" y="312" text-anchor="middle">0.3306</text>
  <text class="value" x="1233.75" y="312" text-anchor="middle">0.5638</text>

  <!-- XGBoost -->
  <text class="best" x="596.25" y="370" text-anchor="middle">0.3840</text>
  <text class="value" x="808.75" y="370" text-anchor="middle">0.6218</text>
  <text class="value" x="1021.25" y="370" text-anchor="middle">0.3260</text>
  <text class="best" x="1233.75" y="370" text-anchor="middle">0.5683</text>

  <!-- BERT -->
  <text class="value" x="596.25" y="428" text-anchor="middle">0.3566</text>
  <text class="value" x="808.75" y="428" text-anchor="middle">0.6019</text>
  <text class="best" x="1021.25" y="428" text-anchor="middle">0.4029</text>
  <text class="value" x="1233.75" y="428" text-anchor="middle">0.5533</text>

  <!-- BiLSTM + Attention -->
  <text class="value" x="596.25" y="486" text-anchor="middle">0.3507</text>
  <text class="value" x="808.75" y="486" text-anchor="middle">0.5392</text>
  <text class="value" x="1021.25" y="486" text-anchor="middle">0.3486</text>
  <text class="value" x="1233.75" y="486" text-anchor="middle">0.4507</text>

  <text class="note" x="60" y="552">Before: leakage-affected historical benchmark. After: source-grouped leakage-repaired benchmark.</text>
  <text class="note" x="60" y="578">Bold values indicate the highest point estimate within each metric and evaluation version.</text>
</svg>
