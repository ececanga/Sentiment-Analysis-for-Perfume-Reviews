    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/predictions/random_forest_oof.csv
    sha256: 3d2d585adc52c91dc07e0cd0f52392426739a6bdb306a404b3be82ebd4af8e32
  accepted_random_forest_metrics:
    path: outputs/gemini_browser_og784_source_grouped_v1/model_benchmark/metrics/random_forest.json
    sha256: c298a975b1e9b10423651fdf86094740e08944883d6bb1a2721cb56c779bd6fa
  accepted_benchmark_checksums:
    path: outputs/gemini_browser_og784_source_grouped_v1/SHA256SUMS
    sha256: 11cca80d9767e0e368c2502aae57f7263c0b5d9bfd20794f85df58681f47f852

task:
  official_labels:
    - joy
    - sadness
    - fear
    - trust
    - surprise
    - anticipation
    - disgust
  excluded_label: anger
  sensitivity_labels:
    - joy
    - sadness
    - trust
    - surprise
    - anticipation
    - disgust
  expected_feature_count: 58
  feature_family_counts:
    NRC: 10
    VAD: 3
    Hartmann: 7
    Savani: 6
    GoEmotions: 28
    Cardiff: 4

model:
  family: RandomForestClassifier
  n_estimators: 500
  class_weight: balanced_subsample
  random_seed: 42
  n_jobs: 1
  preprocessing:
    imputer: median
  training_sample_weight: none

variants:
  full_hybrid:
    role: accepted_control_replay_gate
    families: [NRC, VAD, Hartmann, Savani, GoEmotions, Cardiff]
    feature_count: 58
  nrc_only:
    families: [NRC]
    feature_count: 10
  vad_only:
    families: [VAD]
    feature_count: 3
  transformer_only:
    families: [Hartmann, Savani, GoEmotions, Cardiff]
    feature_count: 45
  nrc_plus_vad:
    families: [NRC, VAD]
    feature_count: 13
  nrc_plus_transformer:
    families: [NRC, Hartmann, Savani, GoEmotions, Cardiff]
    feature_count: 55
  vad_plus_transformer:
    families: [VAD, Hartmann, Savani, GoEmotions, Cardiff]
    feature_count: 48

evaluation:
  threshold: 0.3
  full_control_probability_tolerance: 0.000000000001
  reported_metrics:
    - macro_average_precision
    - macro_f1
    - macro_roc_auc
  component_equal_point_estimates: true
  paired_source_component_bootstrap:
    repetitions: 2000
    seed: 42
    confidence_level: 0.95
    interval: percentile_linear
    resampling_unit: source_group_id
    identical_draws_across_variants: true
  label_scopes:
    - seven_labels
    - fear_excluded_six_labels
  difference_definition: full_hybrid_minus_comparison

execution:
  task_order: full_control_gate_then_six_combinations
  fit_task_count: 245
  new_combination_fit_task_count: 210
  control_gate_fit_task_count: 35
  checkpoint_granularity: fold_by_label
  resume_by_default: true
  pause_after_current_fit_on_signal: true

scope_exclusions:
  - no_threshold_tuning
  - no_model_hyperparameter_selection
  - no_deep_model_fusion
  - no_synthetic_data
  - no_thesis_edit_during_experiment_execution

outputs:
  root: outputs/source_grouped_random_forest_feature_combination_ablation_v1
