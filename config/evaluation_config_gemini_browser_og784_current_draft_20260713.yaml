# Reconstructed archival configuration for the thesis current-draft benchmark.
#
# This file describes the frozen artifacts under
# outputs/gemini_browser_og784/model_benchmark. It was created after the runs
# and is not represented as the exact configuration file loaded by every model.
# The run manifests and the commit-pinned configuration copies in the Phase 1
# archive are the authoritative execution records.

benchmark:
  name: gemini_browser_og784_current_draft_20260713
  task_type: multi_label_emotion_classification
  status: archived_non_final_pending_grouped_cv_rerun
  frozen_at_utc: "2026-07-13T00:00:00Z"
  interpretation: current_draft_benchmark_only

provenance:
  config_status: reconstructed_after_runs
  exact_run_configuration_sources:
    - git_commit: a182f2e0273dff33b875f27e5cb1ea9b6af87333
      models:
        - logistic_regression
        - xgboost
      path_at_commit: config/evaluation_config.yaml
    - git_commit: fb63b85b26e6bd3599fdb15cb44bd4401a0bb521
      models:
        - random_forest
        - bert
        - bilstm_attention
      path_at_commit: config/evaluation_config.yaml
  annotation:
    recorded_labeler: Gemini 3.1 Pro in the browser
    identity_verification: not_machine_verifiable_from_preserved_browser_responses
    defense_safe_description: >-
      The project log records the browser labeler as Gemini 3.1 Pro. The
      repository preserves the fixed prompt, all input packets, pasted CSV
      responses, validation outputs, and final label tables; however, the
      browser responses themselves do not embed machine-verifiable model-version
      or session metadata.
    packet_generated_at_utc: "2026-06-15T08:10:54.077823+00:00"
    final_report_generated_at_utc: "2026-06-15T10:00:04.763160+00:00"
    packet_dir: data/annotation_packets/og784_gemini_browser_pro_review_level
    label_dir: labels/gemini_browser_og784
    prompt_path: data/annotation_packets/og784_gemini_browser_pro_review_level/prompt.md
    packet_manifest_path: data/annotation_packets/og784_gemini_browser_pro_review_level/manifest.csv
    final_labels_path: labels/gemini_browser_og784/gemini_browser_labels_og784_v1.csv
    pipeline_labels_path: labels/gemini_browser_og784/gemini_browser_labels_og784_v1_pipeline.csv
  known_limitations:
    - Existing folds are perfume-level KFold folds, not source-video or transcript groups.
    - Shared source videos and normalized transcripts cross folds; results require a grouped-CV rerun before final thesis use.
    - Browser responses do not independently authenticate the exact Gemini model version or session metadata.
    - Per-batch labeling timestamps and exact ingestion command lines were not preserved.
    - Historical threshold tables mix artifact branches and are not final evidence.

data:
  canonical_feature_label_csv: outputs/gemini_browser_og784/analysis_out/gemini_browser_og784_feature_labels.csv
  canonical_raw_transcript_csv: data/raw/YouTube_Perfume_Reviews_FullyFormatted.csv
  canonical_label_csv: labels/gemini_browser_og784/gemini_browser_labels_og784_v1.csv
  sample_granularity: perfume_level
  unit_id_column: perfume_id
  display_name_columns:
    - Perfume
    - perfume_name
    - perfume_name_unified
    - perfume_name_gemini
  feature_prefixes:
    - NRC_
    - VAD_
    - Hartmann_
    - Savani_
    - GoEmotions_
    - Cardiff_
  deep_text_source_csv: data/raw/YouTube_Perfume_Reviews_FullyFormatted.csv
  deep_text_source_text_column: Final Transcript
  deep_text_dataset_jsonl: outputs/gemini_browser_og784/model_benchmark/datasets/perfume_text_dataset_v1.jsonl
  deep_text_dataset_chunks_csv: outputs/gemini_browser_og784/model_benchmark/datasets/perfume_text_dataset_v1_chunks.csv
  deep_text_dataset_summary_json: outputs/gemini_browser_og784/model_benchmark/datasets/perfume_text_dataset_v1_summary.json

targets:
  official_emotion_columns:
    - joy
    - sadness
    - fear
    - trust
    - surprise
    - anticipation
    - disgust
  excluded_emotion_columns:
    anger: excluded_from_the_recorded_seven_label_benchmark
  secondary_vad_columns:
    - valence
    - arousal
    - dominance

models:
  archived_model_set:
    - logistic_regression
    - xgboost
    - random_forest
    - bert
    - bilstm_attention
  bert:
    checkpoint: monologg/bert-base-cased-goemotions-original
    local_files_only: true
    max_length: 96
    aggregation_strategy: mean_probability
    train_batch_size: 8
    eval_batch_size: 16
    learning_rate: 2.0e-5
    weight_decay: 0.01
    max_epochs: 3
    patience: 1
    min_delta: 0.0001
    warmup_ratio: 0.1
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    selection_metric: macro_f1
  bilstm_attention:
    aggregation_strategy: mean_probability
    lowercase_tokens: true
    min_token_freq: 2
    max_vocab_size: 20000
    max_tokens: 208
    embedding_dim: 96
    hidden_size: 64
    attention_dim: 64
    lstm_layers: 1
    dropout: 0.3
    train_batch_size: 64
    eval_batch_size: 128
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    max_epochs: 12
    patience: 2
    min_delta: 0.0001
    max_grad_norm: 1.0
    selection_metric: macro_f1

evaluation:
  reported_metrics:
    - macro_f1
    - macro_roc_auc
    - macro_average_precision
  recorded_column_name_for_macro_average_precision: macro_pr_auc
  secondary_metrics:
    - per_label_f1
    - per_label_roc_auc
    - per_label_average_precision
    - micro_f1
    - subset_accuracy
    - hamming_loss
  probability_threshold: 0.3
  threshold_tuning:
    enabled: true
    selection_metric: macro_f1
    strategies:
      - global
      - per_label
    threshold_grid:
      start: 0.05
      end: 0.95
      step: 0.05
    tie_break: closest_to_baseline
  macro_average_over: official_emotion_columns_only
  vad_in_main_table: false
  uncertainty_intervals_available: false

splits:
  outer_cv:
    type: kfold
    n_splits: 5
    shuffle: true
    random_state: 42
    sort_by_before_split: perfume_id
    manifest_path: outputs/gemini_browser_og784/model_benchmark/tables/fold_assignments.csv
    leakage_status: known_source_level_overlap_requires_grouped_rerun
  inner_validation:
    applies_to:
      - logistic_regression
      - xgboost
      - random_forest
      - bert
      - bilstm_attention
    type: kfold_first_split_holdout
    n_splits: 10
    shuffle: true
    random_state: 42
    sort_by_before_split: perfume_id
    manifest_path_pattern: outputs/gemini_browser_og784/model_benchmark/tables/{model_id}_inner_val_folds.csv

seeds:
  data_seed: 42
  model_seed: 42
  repeated_cv: false
  multi_seed_averaging: false
  best_seed_selection: false

artifacts:
  root_dir: outputs/gemini_browser_og784/model_benchmark
  required_per_model:
    metrics_json: outputs/gemini_browser_og784/model_benchmark/metrics/{model_id}.json
    per_label_csv: outputs/gemini_browser_og784/model_benchmark/metrics/{model_id}_per_label.csv
    predictions_csv: outputs/gemini_browser_og784/model_benchmark/predictions/{model_id}_oof.csv
    per_label_plot: outputs/gemini_browser_og784/model_benchmark/figures/{model_id}_per_label_metrics.png
    roc_pr_plot: outputs/gemini_browser_og784/model_benchmark/figures/{model_id}_roc_pr_curves.png
    run_log: outputs/gemini_browser_og784/model_benchmark/logs/{model_id}.log
    run_manifest: outputs/gemini_browser_og784/model_benchmark/logs/{model_id}_run.json
    interpretation_note: outputs/gemini_browser_og784/model_benchmark/tables/{model_id}_note.md
  benchmark_wide:
    comparison_table_csv: outputs/gemini_browser_og784/model_benchmark/tables/comparison_table.csv
    fold_manifest_csv: outputs/gemini_browser_og784/model_benchmark/tables/fold_assignments.csv

completion_rule:
  archival_snapshot_requires:
    - source_and_payload_sha256_inventory
    - labels_and_folds
    - one_oof_prediction_file_per_model
    - metrics_tables_and_figures
    - run_manifests
    - annotation_packets_and_raw_pastes
    - thesis_table_to_artifact_map
